<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bajar</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}
header{
  background:#e91b23;
  color:white;
  padding:18px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}
.search{
  margin:15px;
  padding:14px;
  width:calc(100% - 30px);
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
.offer{
  margin:15px;
  padding:20px;
  background:#e91b23;
  color:white;
  border-radius:15px;
  text-align:center;
}
.offer h2{
  margin:0 0 10px;
}
.timer{
  font-size:28px;
  font-weight:bold;
}
h2{
  margin-left:15px;
}
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}
.product{
  background:white;
  border-radius:12px;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 8px #ddd;
}
.product .pic{
  font-size:55px;
}
.price{
  font-size:20px;
  font-weight:bold;
}
.old{
  text-decoration:line-through;
  color:#888;
  font-size:13px;
}
button{
  background:#e91b23;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>SMART BAJAAR</header>

<input class="search" placeholder="🔍 Product खोजें...">

<div class="offer">
  <h2>🔥 FLASH SALE</h2>
  <div>50% तक की छूट</div>
  <div class="timer" id="timer">23:59:59</div>
</div>

<h2>Popular Products</h2>

<div class="products">

<div class="product">
  <div class="pic">👕</div>
  <b>T-Shirt</b>
  <p><span class="price">₹499</span></p>
  <span class="old">₹799</span>
  <br>
  <button>View Product</button>
</div>

<div class="product">
  <div class="pic">👟</div>
  <b>Shoes</b>
  <p><span class="price">₹999</span></p>
  <span class="old">₹1499</span>
  <br>
  <button>View Product</button>
</div>

</div>

<script>
let time=86399;

setInterval(function(){
  let h=Math.floor(time/3600);
  let m=Math.floor((time%3600)/60);
  let s=time%60;

  document.getElementById("timer").innerHTML=
  String(h).padStart(2,'0')+":"+
  String(m).padStart(2,'0')+":"+
  String(s).padStart(2,'0');

  if(time>0) time--;
},1000);
</script>

</body>
</html>
